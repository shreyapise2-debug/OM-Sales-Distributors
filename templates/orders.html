<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Orders</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><aside class="sidebar"><div class="brand">OM <span>Sales</span></div><nav class="nav"><a href="/">▦ &nbsp; Dashboard</a><a href="/products">▣ &nbsp; Products</a><a href="/retailers">♙ &nbsp; Retailers</a><a class="active" href="/orders">▤ &nbsp; Sales Orders</a></nav></aside><main><h1>Sales Orders</h1><p class="sub">Track retailer orders and fulfilment status</p><div class="panel" style="margin-top:24px"><table><tr><th>Order ID</th><th>Retailer</th><th>Date</th><th>Status</th><th>Total amount</th></tr>{% for o in rows %}<tr><td>#{{o.order_id}}</td><td>{{o.retailer_name}}</td><td>{{o.order_date}}</td><td><span class="status">{{o.order_status}}</span></td><td>₹{{'%.2f'|format(o.total_amount)}}</td></tr>{% endfor %}</table></div></main></body></html>
